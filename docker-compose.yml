# docker-compose for the CIS Benchmark app (mitre/cis-bench).
#
# Two services from the same image:
#   ui  -> long-running web server (http://localhost:8000)
#   cli -> one-shot CLI invocations
#
# Web UI:
#   docker compose up ui           # then open http://localhost:8000
#
# CLI (one-shot):
#   docker compose run --rm cli auth login --cookies /data/cookies.txt
#   docker compose run --rm cli search "ubuntu 22"
#
# The `data` and `work` volumes persist your session + exports and are
# SHARED by both services, so authenticating in either place works in both.

x-common: &common
  build:
    context: .
    args:
      CIS_BENCH_VERSION: "0.5.2"
  image: cis-bench:local
  volumes:
    - ./data:/data
    - ./work:/work
  environment:
    CIS_BENCH_ENV: "production"
    CIS_BENCH_SSL_VERIFY: "true"
    # Web UI login. Set the real values in .env (gitignored). The default only
    # includes a throwaway user so the sensitive password never lands in git.
    APP_USERS: "${APP_USERS:-Lander:1234}"
    APP_SECRET: "${APP_SECRET:-}"
    APP_SESSION_TTL: "${APP_SESSION_TTL:-86400}"
    CIS_COOKIES_B64: "${CIS_COOKIES_B64:-}"

services:
  ui:
    <<: *common
    ports:
      - "8000:8000"
    restart: unless-stopped

  cli:
    <<: *common
    # Run the CLI directly instead of the web server.
    entrypoint: ["cis-bench"]
    command: ["--help"]
    restart: "no"
